<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CEOSA Dashboard</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Mobile Theme Configuration -->
  <meta name="theme-color" content="#4f5a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CEOSA - Tuberías">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #4f5a22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #offline-banner {
      display: none;
      background-color: #b71c1c;
      color: #ffffff;
      text-align: center;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1000;
    }
    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Connectivity Status Bar -->
  <div id="offline-banner">Sin conexión a Internet. El panel requiere conexión activa para actualizar datos.</div>

  <!-- Power BI Embedded View -->
  <iframe 
    src="https://app.powerbi.com/view?r=eyJrIjoiN2Q5ZGU4ZWMtYzhjYi00ZGI4LThjYmYtYjJkYWFkMWRhNTFhIiwidCI6ImI3ODZkMDEzLWNhZTYtNDM0NS04M2JlLWJhOTc1NWZkOGJhYiJ9" 
    allowFullScreen="true"
    title="CEOSA Power BI Dashboard">
  </iframe>

  <!-- Service Worker & Offline Detection Script -->
  <script>
    const banner = document.getElementById('offline-banner');
    function updateOnlineStatus() {
      banner.style.display = navigator.onLine ? 'none' : 'block';
    }
    
    // Check status immediately upon loading
    updateOnlineStatus();

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('ServiceWorker registered successfully:', reg.scope))
          .catch(err => console.error('ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
